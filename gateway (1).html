<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#1d2b22;--mut:#6b776f;--line:#e6dfd0;--acc:#1f7a4d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a14;--card:#172620;--ink:#f3ebdd;--mut:#9fb0a6;--line:#27382f;--acc:#3fbf82}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;padding:16px}
.c{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;text-align:center}
h1{margin:0 0 4px;font-size:1.35rem}.tb{display:inline-block;padding:3px 12px;border-radius:99px;background:var(--line);font-weight:700;margin-bottom:14px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;margin:8px 0;border:1px solid var(--line);border-radius:12px;text-align:left}
.kv small{color:var(--mut);display:block}.kv b{font-size:1.1rem;word-break:break-all}
button,a.b{display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
button.g,a.g{background:none;color:var(--acc);border:1px solid var(--acc)}.cp{width:auto;margin:0;padding:8px 12px;font-size:.9rem}
.m{color:var(--mut);font-size:.9rem;margin-top:12px}
</style></head><body><div class="c" id="app"></div>
<script>
(function(){
var H=new URLSearchParams(location.hash.slice(1)),T=(H.get('t')||'').toUpperCase(),B=(H.get('h')||'').replace(/\/+$/,''),N=H.get('n')||'Menu',WS=H.get('ws')||'',WP=H.get('wp')||'',app=document.getElementById('app'),tm=0;
if(B&&!/^https?:\/\//.test(B))B='http://'+B;
var KEY='sk_joined_'+B;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function store(v){try{if(v)localStorage.setItem(KEY,String(Date.now()));var t=+localStorage.getItem(KEY)||0;return t&&Date.now()-t<8*36e5}catch(e){return null}}
if(!/^https?:\/\/[^\s<>"']{3,100}$/.test(B)||!/^[ABC]\d{1,3}$/.test(T)){app.appendChild(el('h1',null,'Please scan the QR code on your table again.'));return}
var MENU=B+'/m?t='+T;
function open(){store(1);location.replace(MENU)}
function head(){app.innerHTML='';app.appendChild(el('h1',null,N));app.appendChild(el('div','tb',/^C/.test(T)?'Cabin '+T.slice(1):'Table '+T))}
function copy(v,b){try{navigator.clipboard.writeText(v).then(function(){b.textContent='Copied ✓'})}catch(e){}}
function join(){clearTimeout(tm);head();
  if(WS){[['Wi-Fi name',WS],['Password',WP]].forEach(function(r){if(r[0]=='Password'&&!r[1])return;var d=el('div','kv'),l=el('div');l.appendChild(el('small',null,r[0]));l.appendChild(el('b',null,r[1]));d.appendChild(l);var b=el('button','cp g','Copy');b.onclick=function(){copy(r[1],b)};d.appendChild(b);app.appendChild(d)});
    app.appendChild(el('div','m','1. Join this Wi-Fi in your phone settings.  2. Come back here and tap the green button.'))}
  else app.appendChild(el('div','m','Please connect to our restaurant Wi-Fi, then tap the green button.'));
  if(/Android/i.test(navigator.userAgent)){var a=el('a','b g','📶 Open Wi-Fi settings');a.href='intent:#Intent;action=android.settings.WIFI_SETTINGS;end';app.appendChild(a)}
  var go=el('button',null,'✅ I am connected – open the menu');go.onclick=open;app.appendChild(go)}
if(store()&&H.get('join')!='1'){head();app.appendChild(el('div','m','Opening the menu…'));var j=el('button','g','Menu not opening? Join the Wi-Fi first');j.onclick=join;app.appendChild(j);tm=setTimeout(open,1200)}
else join();
})();
</script></body></html>
